<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">G</div><div><h1>GFG AutoSolver <span>PRO</span></h1><small>AI solution → GitHub archive</small></div></header>
<div class="notice">Review captured problem text. This tool does not submit to GFG.</div>
<div id="status" role="status">Ready</div>
<button id="capture" class="secondary">↧ Capture current GFG problem</button>
<label>Problem title<input id="title" placeholder="Problem title"></label>
<label>Problem URL<input id="url" placeholder="https://www.geeksforgeeks.org/..."></label>
<label>Statement<textarea id="statement" rows="7" placeholder="Problem statement"></textarea></label>
<label>Constraints<textarea id="constraints" rows="2"></textarea></label>
<label>Examples<textarea id="examples" rows="3"></textarea></label>
<button id="solve">✦ Generate Java + Commit to GitHub</button>
<div id="result" class="result"></div><a class="settings" href="options.html" target="_blank">⚙ Settings</a>
<script src="popup.js"></script></body></html>
